<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Router SSH Controller</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>
<body>

    <div class="container">

        <h1>Router SSH Controller</h1>

        <p class="subtitle">
            Execute Cisco router commands using Paramiko SSH
        </p>

        <div class="form-group">

            <label for="routerIp">
                Router IP Address
            </label>

            <input
                type="text"
                id="routerIp"
                placeholder="Example: 192.168.138.132"
            >

        </div>

        <div class="form-group">

            <label for="routerCommand">
                Router Command
            </label>
<input
                type="text"
                id="routerCommand"
                placeholder="Example: show ip interface brief"
            >

        </div>

        <button onclick="executeCommand()">
            Execute
        </button>
<h2>Router Output</h2>

        <pre id="output">
Waiting for command...
        </pre>

    </div>

    <script src="/script.js"></script>

</body>
</html>
